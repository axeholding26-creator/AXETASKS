<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <!-- Brand Emblem Vector: AxeTask Calligraphic Ribbon + Document Checklist + Bold Brand Typo -->
  <g transform="translate(15, 10)">
    <!-- Top flourish loop -->
    <path
      d="M245 60 C245 60 270 135 320 160 C300 160 290 120 310 135"
      stroke="#2563EB"
      stroke-width="24"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Main dynamic calligraphic loop ribbon with long needle tail -->
    <path
      d="M250 70 C238 115 180 120 180 175 C180 215 238 202 265 165 C235 210 150 210 138 260 C125 310 200 330 245 260 L330 400"
      stroke="#2563EB"
      stroke-width="24"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Document Checklist Badge -->
    <g transform="translate(268, 175)">
      <!-- Sheet background -->
      <rect
        x="0"
        y="0"
        width="135"
        height="170"
        rx="24"
        fill="#FFFFFF"
        stroke="#2563EB"
        stroke-width="16"
      />

      <!-- Circular Checkmark Badge at top right -->
      <circle
        cx="120"
        cy="15"
        r="36"
        fill="#2563EB"
      />
      <path
        d="M106 15 L117 26 L137 6"
        stroke="#FFFFFF"
        stroke-width="10"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- Checkbox & Line 1 -->
      <rect x="20" y="42" width="18" height="18" rx="4" fill="none" stroke="#2563EB" stroke-width="8" />
      <line x1="50" y1="51" x2="112" y2="51" stroke="#2563EB" stroke-width="9" stroke-linecap="round" />

      <!-- Checkbox & Line 2 -->
      <rect x="20" y="78" width="18" height="18" rx="4" fill="none" stroke="#2563EB" stroke-width="8" />
      <line x1="50" y1="87" x2="112" y2="87" stroke="#2563EB" stroke-width="9" stroke-linecap="round" />

      <!-- Checkbox & Line 3 -->
      <rect x="20" y="114" width="18" height="18" rx="4" fill="none" stroke="#2563EB" stroke-width="8" />
      <line x1="50" y1="123" x2="112" y2="123" stroke="#2563EB" stroke-width="9" stroke-linecap="round" />
    </g>

    <!-- Typography: Task in bold royal blue -->
    <text
      x="240"
      y="445"
      text-anchor="middle"
      fill="#2563EB"
      font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
      font-weight="900"
      font-size="82"
      letter-spacing="-1px"
    >Task</text>
  </g>
</svg>
