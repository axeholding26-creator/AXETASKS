<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Calligraphic 'A' Ribbon Stroke in Royal Blue -->
  <path
    d="M98 24 C98 24 108 52 126 62 C120 62 116 46 124 52"
    stroke="#2563EB"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M100 28 C96 44 76 46 76 66 C76 80 98 76 108 62 C96 78 64 78 60 98 C56 118 84 124 102 98 L138 152"
    stroke="#2563EB"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  
  <!-- Task Document Checklist Card -->
  <g transform="translate(108, 68)">
    <!-- Document background with rounded corners -->
    <rect
      x="0"
      y="0"
      width="58"
      height="72"
      rx="10"
      fill="#0F172A"
      stroke="#2563EB"
      stroke-width="6"
    />
    <!-- Circular checkmark badge on top right -->
    <circle cx="52" cy="6" r="15" fill="#2563EB" />
    <path
      d="M45 6 L50 11 L59 2"
      stroke="#FFFFFF"
      stroke-width="4.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Checkbox 1 + Line 1 -->
    <rect x="9" y="18" width="7" height="7" rx="2" fill="none" stroke="#2563EB" stroke-width="3" />
    <line x1="21" y1="21.5" x2="48" y2="21.5" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- Checkbox 2 + Line 2 -->
    <rect x="9" y="32" width="7" height="7" rx="2" fill="none" stroke="#2563EB" stroke-width="3" />
    <line x1="21" y1="35.5" x2="48" y2="35.5" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- Checkbox 3 + Line 3 -->
    <rect x="9" y="46" width="7" height="7" rx="2" fill="none" stroke="#2563EB" stroke-width="3" />
    <line x1="21" y1="49.5" x2="48" y2="49.5" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round" />
  </g>
</svg>
